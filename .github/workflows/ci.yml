name: GeoForge CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      stress:
        description: Run the extended stress benchmark
        type: boolean
        default: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile all committed Python files
        run: python -m compileall -q geoforge.py geoforge_upgrade_suite geoforge_7fases_benchmark.py
      - name: Deterministic proof regression
        run: |
          mkdir -p local-results
          python EXECUTAR_BENCHMARK_GEOFORGE_SEM_TREINO.py --mode quick --out local-results/quick.json
      - name: Extended stress benchmark (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.stress
        run: python EXECUTAR_BENCHMARK_GEOFORGE_SEM_TREINO.py --mode stress --out local-results/stress.json
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geoforge-regression-reports
          path: local-results/
          if-no-files-found: ignore
